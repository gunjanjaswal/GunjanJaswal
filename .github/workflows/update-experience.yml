name: Update Years of Experience

on:
  schedule:
    - cron: '30 3 1 * *'   # 03:30 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-experience:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Recalculate years of experience
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Career start: August 2009. Anniversary rolls over each August.
            const BASE_YEAR = 2009;
            const ANNIVERSARY_MONTH = 8; // August

            const now = new Date();
            const year = now.getUTCFullYear();
            const month = now.getUTCMonth() + 1; // 1-12
            const years = (year - BASE_YEAR) - (month < ANNIVERSARY_MONTH ? 1 : 0);

            const path = 'README.md';
            let readme = fs.readFileSync(path, 'utf8');
            const before = readme;

            // 1) Header banner image  ...16%2B%20Years%20Shipping...
            readme = readme.replace(/(\d+)%2B%20Years/g, `${years}%2B%20Years`);
            // 2) "16+ years" style mentions
            readme = readme.replace(/(\d+)\+ years/gi, `${years}+ years`);
            // 3) "16 years" style mentions (not the "N+ years" ones)
            readme = readme.replace(/(?<!\+)\b(\d+) years/gi, `${years} years`);

            if (readme !== before) {
              fs.writeFileSync(path, readme);
              console.log(`Updated years of experience to ${years}.`);
            } else {
              console.log(`No change needed. Years already at ${years}.`);
            }

      - name: Commit if changed
        run: |
          git config user.name "gunjanjaswal"
          git config user.email "gunjanjaswal@gmail.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No experience change to commit."
          else
            git commit -m "Update years of experience"
            git push
          fi
